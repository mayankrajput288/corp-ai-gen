<div class="sec"><h2 class="rv">Jump in</h2></div>${cards(stu?'stu':'corp')}`;

$('#v-stu').innerHTML=head('Student Hub','Pick a topic, then a tool.')+`<div class="row">${['C','C++','Java','Python','JavaScript','DSA','DBMS','OS','CN','Web','AI','ML'].map(x=>`<button class="btn ptop">${x}</button>`).join('')}</div>`+cards('stu');
$('#v-corp').innerHTML=head('Corporate Hub','Less busywork. More decisions.')+cards('corp');
$('#v-car').innerHTML=head('Career & Jobs','Resumes, interviews, roadmaps.')+cards('car')+`<div class="sec"><h2 class="rv">Categories</h2></div><div class="row">${JOBS.map(j=>`<span class="btn">${j}</span>`).join('')}</div><p class="note">Live listings need a configured job feed, showing source and posting date.</p>`;
$('#v-doc').innerHTML=head('Document AI','Upload TXT or CSV, then ask. Answers come from your file.')+`<div class="card st rv"><input type="file" id="file" accept=".txt,.csv,.md"><p class="note">PDF, DOCX and XLSX parsing needs the server build.</p><input id="dq" placeholder="Ask about your document"><button class="cta" id="dask">Ask</button><div class="out" id="dout">Upload a file to start.</div></div>`;
$('#v-news').innerHTML=head('TechPulse','Stay Ahead of Technology.')+`<div class="row">${CATS.map((c,i)=>`<button class="btn cat ${i?'':'on'}">${c}</button>`).join('')}</div>
<div class="card st rv"><span class="tag">Live news</span><div class="row"><select id="prov" class="sel"><option value="auto">Auto-detect provider</option><option value="gnews">GNews</option><option value="newsapi">NewsAPI.org</option><option value="newsdata">NewsData.io</option></select></div><input id="nk" type="password" placeholder="Paste your news API key"><button class="cta" id="nl">Load live news</button><p class="note" id="ns" style="margin-top:12px">Your key stays in this browser only. Every story links to its original publisher.</p></div><div class="fg" id="feed"></div>
<div class="sec"><h2 class="rv">Summarise an article</h2></div><textarea id="na" rows="5" placeholder="Paste article text"></textarea>
<div class="row"><button class="btn nm" data-m="60s">60-sec brief</button><button class="btn nm" data-m="5">5 highlights</button><button class="btn nm" data-m="simple">Simple English</button><button class="btn nm" data-m="hing">Hinglish</button></div><div class="out" id="nout">Paste text, pick a style.</div>`;
$('#v-lib').innerHTML=head('My Library','Everything you saved.')+(S.lib.length?`<div class="grid">${S.lib.map((l,i)=>`<div class="card st rv"><h3 style="margin-top:0">${l.t}</h3><p style="white-space:pre-wrap;margin-top:8px">${l.b.slice(0,150)}…</p><button class="btn" data-del="${i}" style="margin-top:14px">Delete</button></div>`).join('')}</div>`:`<div class="card st rv"><h3 style="margin-top:0">Nothing yet</h3><p>Generate something and hit Save.</p></div>`);
$('#v-price').innerHTML=head('Pricing','Start free. Upgrade when you outgrow it.')+`<div class="grid plans">
<div class="card st rv"><span class="mono">Free</span><div class="price">₹0</div><p>Limited AI usage<br>Basic document analysis<br>Limited code explanations<br>Basic news</p></div>
<div class="card st hot rv"><span class="tag">Popular</span><div class="price">₹199<small style="font-size:16px">/mo</small></div><p>Higher AI usage<br>Advanced document analysis<br>AI coding assistant<br>Resume + writing tools<br>News</p><br><button class="cta" style="background:var(--pop);color:#10121c;box-shadow:5px 5px 0 #10121c" data-conf>Go Pro →</button></div>
<div class="card st rv"><span class="mono">Team (placeholder)</span><div class="price">Custom</div><p>Your spec was cut off after Pro. Send the rest.</p></div></div>`;
$('#v-prof').innerHTML=head('Profile','Your role shapes your dashboard.')+`<div class="row">${['Student','Corporate Professional','Freelancer','Other'].map(x=>`<button class="btn setrole ${x===S.role?'on':''}">${x}</button>`).join('')}</div><input id="nm2" placeholder="Your name"><p class="note">Sign-in and database need the server build. This demo stores data in your browser.</p>`;
count();watch()}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});
function watch(){$$('.rv').forEach(e=>{if(!e.classList.contains('in'))io.observe(e)})}
function count(){$$('.stat').forEach(e=>{const n=+e.dataset.n;let c=0;const id=setInterval(()=>{c+=Math.max(1,n/30|0);if(c>=n){c=n;clearInterval(id)}e.textContent=c},30)});setTimeout(()=>$$('.bar i').forEach(b=>b.style.width=b.dataset.w+'%'),200)}
function go(v){$$('.view').forEach(e=>e.classList.toggle('on',e.id=='v-'+v));$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));if(v=='home')count();scrollTo({top:0,behavior:'smooth'});setTimeout(watch,50)}
function confetti(){const c=['#2b3cff','#c8f33a','#ff5a36','#fff'];for(let i=0;i<50;i++){const d=document.createElement('i');d.className='cf';d.style.left=Math.random()*100+'vw';d.style.background=c[i%4];d.style.borderRadius=i%3?'0':'50%';d.style.animationDelay=Math.random()*.4+'s';document.body.append(d);setTimeout(()=>d.remove(),2300)}}
function type(el,txt){el.classList.add('t');el.textContent='';let i=0;const id=setInterval(()=>{el.textContent+=txt.slice(i,i+3);i+=3;if(i>=txt.length){clearInterval(id);el.classList.remove('t')}},16)}
const fake=(n,x)=>`[Demo output: connect an AI API for real results]\n\n${n} → "${(x.trim()||'your topic').slice(0,80)}"\n\n01 Goal: say what you want in one line.\n02 Key points: three short, specific bullets.\n03 Next step: one action for today.`;
function open(k,i){const t=T[k][i];$('#box').innerHTML=`<span class="mono">${pad(i)} / ${k}</span><h2 style="margin-top:10px">${t[0]}</h2><p class="sub" style="margin:6px 0">${t[1]}</p><textarea id="ti" rows="5" placeholder="Describe your task or paste content"></textarea><div class="row"><button class="cta" id="gen">Generate</button><button class="btn" id="sv">Save</button><button class="btn" id="cl">Close</button></div><div class="out" id="to">Output shows here.</div>`;
$('#panel').classList.add('on');let last='';
$('#gen').onclick=()=>{last=fake(t[0],$('#ti').value);type($('#to'),last);confetti()};
$('#sv').onclick=()=>{if(!last)return;S.lib.push({t:t[0],b:last});save();render();$('#sv').textContent='Saved ✓'};
$('#cl').onclick=()=>$('#panel').classList.remove('on')}
document.addEventListener('click',e=>{const t=e.target.closest('[data-v],.card[data-k],[data-del],.setrole,.cat,.nm,[data-conf],.ptop');if(!t)return;
if(t.dataset.v)go(t.dataset.v);else if(t.dataset.k)open(t.dataset.k,+t.dataset.i);
else if(t.dataset.del){S.lib.splice(+t.dataset.del,1);save();render();go('lib')}
else if(t.classList.contains('setrole')){S.role=t.textContent;save();render();go('prof');confetti()}
else if(t.classList.contains('cat')){$$('.cat').forEach(c=>c.classList.remove('on'));t.classList.add('on')}
else if(t.classList.contains('nm')){const a=$('#na').value.trim();if(!a){$('#nout').textContent='Paste some article text first.';return}const s=a.split(/(?<=[.!?])\s+/).filter(Boolean),m=t.dataset.m;type($('#nout'),'AI-generated summary (extractive demo, '+t.textContent+'):\n\n'+(m=='5'?s.slice(0,5).map((x,i)=>(i+1)+'. '+x).join('\n'):s.slice(0,m=='60s'?3:2).join(' '))+'\n\nRead the original publisher article for the full story.')}
else if(t.dataset.conf)confetti();else t.classList.toggle('on')});
let ft='';document.addEventListener('change',e=>{if(e.target.id=='file'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{ft=r.result;$('#dout').textContent=`Loaded ${f.name} (${ft.length} chars). Ask away.`};r.readAsText(f)}});
document.addEventListener('click',e=>{if(e.target.id=='dask'){const q=$('#dq').value.toLowerCase().split(/\W+/).filter(w=>w.length>3);if(!ft){$('#dout').textContent='Upload a TXT or CSV first.';return}const ls=ft.split(/\n+/).map(l=>[l,q.filter(w=>l.toLowerCase().includes(w)).length]).sort((a,b)=>b[1]-a[1]).slice(0,3).filter(x=>x[1]);type($('#dout'),ls.length?'Closest matches in your document:\n\n'+ls.map(x=>'• '+x[0].slice(0,220)).join('\n'):'No match found in the uploaded document.')}});
let dk=matchMedia('(prefers-color-scheme:dark)').matches;
$('#theme').onclick=()=>{dk=!dk;document.documentElement.dataset.theme=dk?'dark':'light'};
$('#role').onclick=()=>onboard();
function onboard(){$('#box').innerHTML=`<span class="mono">Welcome</span><h2 style="margin:10px 0 18px">Who are you?</h2><div class="grid">${['Student','Corporate Professional','Freelancer','Other'].map((r,i)=>`<div class="card" data-r="${r}"><span class="n mono">${pad(i)}</span><h3 style="margin-top:20px">${r}</h3></div>`).join('')}</div>`;$('#panel').classList.add('on');
$$('[data-r]').forEach(c=>c.onclick=()=>{S.role=c.dataset.r;save();render();$('#panel').classList.remove('on');go('home');confetti()})}
$('#panel').onclick=e=>{if(e.target.id=='panel'&&S.role)e.target.classList.remove('on')};
$('#fab').onclick=()=>$('#chat').classList.toggle('on');
$('#ci').onkeydown=e=>{if(e.key!='Enter'||!e.target.value.trim())return;const v=e.target.value;e.target.value='';const m=$('#msgs');m.insertAdjacentHTML('beforeend','<div class="m u"></div>');m.lastChild.textContent=v;m.insertAdjacentHTML('beforeend','<div class="m a"></div>');type(m.lastChild,'Demo reply: with an AI API connected, I’ll answer “'+v.slice(0,60)+'” properly.');m.scrollTop=1e9};
const cur=$('#cur');document.addEventListener('pointermove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';const h=e.target.closest&&e.target.closest('.card,.btn,.cta,button');cur.style.width=cur.style.height=h?'38px':'14px';cur.style.opacity=h?.6:1});
const W=['Smarter.','Faster.','Further.'];let wi=0;setInterval(()=>{const w=$('#wd');if(!w)return;wi=(wi+1)%3;const n=w.cloneNode();n.textContent=W[wi];w.replaceWith(n)},2200);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let FEED=[];
function draw(){const f=$('#feed');if(!f)return;f.innerHTML=FEED.length?FEED.map((a,i)=>`<div class="card st nw"><span class="mono">${esc(a.p||'Unknown source')} · ${a.d?new Date(a.d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'date n/a'}</span><h3>${esc(a.t)}</h3><p>${esc((a.s||'').slice(0,140))}</p><div class="row"><a class="btn" href="${esc(a.u)}" target="_blank" rel="noopener">Read original ↗</a><button class="btn" data-sum="${i}">Summarise</button></div></div>`).join(''):'<div class="sk"></div>'.repeat(3)}
const mp=a=>({t:a.title,p:a.source&&a.source.name,d:a.publishedAt,u:a.url,s:a.description});
const NORM={gnews:j=>(j.articles||[]).map(mp),newsapi:j=>(j.articles||[]).map(mp),newsdata:j=>(j.results||[]).map(a=>({t:a.title,p:a.source_name,d:a.pubDate,u:a.link,s:a.description}))};
const URLS=(k,q)=>({gnews:`https://gnews.io/api/v4/search?q=${q}&lang=en&max=10&apikey=${k}`,newsapi:`https://newsapi.org/v2/everything?q=${q}&language=en&sortBy=publishedAt&pageSize=12&apiKey=${k}`,newsdata:`https://newsdata.io/api/1/latest?apikey=${k}&q=${q}&language=en`});
async function loadNews(){const k=$('#nk').value.trim(),st=$('#ns');if(!k){st.textContent='Paste your API key first.';return}S.nk=k;save();const cat=($('.cat.on')||{}).textContent||'technology',q=encodeURIComponent(cat);const ps=$('#prov').value=='auto'?['gnews','newsapi','newsdata']:[$('#prov').value];st.textContent='Fetching live headlines…';FEED=[];draw();let err='';
for(const p of ps){try{const r=await fetch(URLS(k,q)[p]);if(!r.ok){err=p+' said '+r.status;continue}const it=NORM[p](await r.json()).filter(a=>a.t&&a.u);if(it.length){FEED=it;draw();st.textContent=`Showing ${it.length} live stories for “${cat}” via ${p}.`;return}err=p+' returned no stories'}catch(e){err='blocked or offline'}}
st.textContent='Could not load ('+err+'). This hosted page may block outside API calls, so open the downloaded file on your own device or host. Also check the key and provider.';draw()}
document.addEventListener('click',e=>{if(e.target.id=='nl')loadNews();if(e.target.classList.contains('cat')&&S.nk&&$('#nk').value)loadNews();const b=e.target.closest('[data-sum]');if(b){const a=FEED[+b.dataset.sum];$('#na').value=a.t+'. '+(a.s||'');$('#na').scrollIntoView({behavior:'smooth',block:'center'})}});
const skin=()=>{const k=S.skin=='neon'?'neon':'cool',d=document.documentElement;d.dataset.skin=k;d.dataset.theme=k=='neon'?'dark':'light';$('#skin').textContent=k=='neon'?'Cool Blue theme':'Neon Dark theme'};
$('#skin').onclick=()=>{S.skin=S.skin=='neon'?'cool':'neon';save();skin();confetti()};
$('#theme').style.display='none';skin();
['⚡','🔥','🎮','✨','🚀','💥'].forEach((x,i)=>{const s=document.createElement('span');s.className='fl';s.textContent=x;s.style.cssText=`left:${[4,91,7,93,48,72][i]}%;top:${[16,24,72,68,90,9][i]}%;animation-delay:-${i}s`;document.body.append(s)});
render();go('home');if(!S.role)onboard();draw();if(S.nk)$('#nk').value=S.nk;
</script></body></html>
